<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Found — CampusFind</title><link rel="stylesheet" href="style.css">
<style>body{background:#f8fafc}.topbar{position:sticky;top:0;background:white;border-bottom:1px solid #e2e8f0;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}.form-wrap{max-width:720px;margin:24px auto;padding:0 16px 80px}.card{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:20px}.field{margin-bottom:14px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:12px}.btn-primary{width:100%;background:#0f172a;color:white;padding:14px;border-radius:14px;font-weight:800;border:none;cursor:pointer}</style>
</head>
<body>
<div class="topbar"><a href="/" style="font-weight:900;text-decoration:none;color:#0f172a">← CampusFind</a><span id="userPill" style="font-size:12px"></span></div>
<div class="form-wrap"><div class="card"><h1>Found something?</h1><p style="font-size:14px;color:#64748b;margin-bottom:16px">Thanks for helping — report in 30 seconds.</p>
<form id="foundForm">
<div class="field"><label>What did you find? *</label><input id="foundItem" required></div>
<div class="field"><label>Where? *</label><input id="foundLocation" required></div>
<div class="field"><label>When? *</label><input id="foundDate" type="date" required></div>
<div class="field"><label>Description *</label><textarea id="foundDescription" rows="3" required></textarea></div>
<div class="field"><label>Photo</label><input type="file" id="photoGallery" accept="image/*"><div id="preview"></div></div>
<button type="submit" id="submitBtn" class="btn-primary">Report found item</button>
</form></div><div id="results"></div></div>
<script type="module">
import { getCurrentUser, onAuthChange, authFetch } from "./public/js/auth.js";
let photoData=""; let currentUser=null;
function renderUser(){ const p=document.getElementById("userPill"); currentUser=getCurrentUser(); p.textContent=currentUser? (currentUser.displayName||currentUser.email) : "Guest can report"; }
onAuthChange(renderUser); renderUser();
async function handleFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    photoData=ev.target.result;
    document.getElementById("preview").innerHTML='<img src="'+photoData+'" style="width:100px;height:100px;object-fit:cover;border-radius:10px">';
  };
  reader.readAsDataURL(file);
}
document.getElementById("photoGallery").addEventListener("change",function(e){ handleFile(e.target.files[0]); });
document.getElementById("foundForm").addEventListener("submit", async function(ev){
  ev.preventDefault();
  const item=document.getElementById("foundItem").value.trim();
  const loc=document.getElementById("foundLocation").value.trim();
  const date=document.getElementById("foundDate").value;
  const desc=document.getElementById("foundDescription").value.trim();
  const btn=document.getElementById("submitBtn"); btn.disabled=true; btn.textContent="Saving...";
  try{
    const res=await authFetch("/api/found",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({item,location:loc,date,description:desc,photo:photoData})});
    const json=await res.json();
    if(!res.ok) throw new Error(json.message);
    document.getElementById("results").innerHTML='<div style="margin-top:16px;padding:16px;background:#f0fdf4;border:2px solid #16a34a;border-radius:16px">✅ Saved! Thanks for helping.</div>';
    document.getElementById("foundForm").reset(); document.getElementById("preview").innerHTML=""; photoData="";
  }catch(err){ document.getElementById("results").innerHTML='Error: '+err.message; }
  finally{ btn.disabled=false; btn.textContent="Report found item"; }
});
</script>
</body>
</html>
