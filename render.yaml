services:
  - type: web
    name: campusfind-ai
    env: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: campusfind-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1